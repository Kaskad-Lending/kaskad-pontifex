[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 512

[rpc_endpoints]
igra = "${IGRA_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
